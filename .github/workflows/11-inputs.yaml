name: 11-working with Inouts
on: 
    workflow_dispatch:
      inputs: 
        dry-run:
            type: boolean
            description: Skip deployment and only prunt build output
            default: : false
        target: 
            type: environment
            required: true
            description: Which environment the workflow will target
        tag:
            type: choice
            options: 
                - v1
                - v2
                - v3
            
jobs: 
    build:
        runs-on: ubuntu-latest
        steps: 
            - name: build
              run: echo "building from tag ${{inputs.tag}}"
    deploy:
        runs-on: ubuntu-latest
        environment: ${{inputs.target}}
        if: ${{!inputs.dry-run}}
        steps: 
            - name: deploy
              run: echo "deploying from tag ${{inputs.target}}"








        
