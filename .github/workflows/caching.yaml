name: using caching
on: 
    workflow_dispatch:
        inputs:
            use-cache:
                description: Whether to execute cache step
                type: boolean
                default: true

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
            run: 
                working-directory: 13-caching/react-app
        steps:
            - name: Checkout to repo code
              uses: actions/checkout@v4
            - name: Setup the node
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'
            - name: install depenedencies
              run: npm ci
            - name: testing
              run: npm run test
            - name: building
              run: npm run build
            - name: deploy
              run: echo "This  deployment is complete"





