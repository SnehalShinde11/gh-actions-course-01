name: using caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: Whether to execute cache step
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 13-caching/react-app

    steps:
      - name: Checkout repo code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: 13-caching/react-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Testing
        run: npm run test

      - name: Building
        run: npm run build

      - name: Deploy
        run: echo "This deployment is complete"
