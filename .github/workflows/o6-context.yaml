name: 06-context
on: 
    push
    workflow_dispatch

jobs: 
    echo_data: 
        runs-on: ubuntu-latest
        steps:
            - name: Display information
              run: |
              echo "Event Name: ${{github.event_name}}"
              echo "ref: ${{github.ref}}"
              echo "SHA: ${{github.sha}}"
              echo "Actor: ${{github.actor}}"
              echo "RUN ID: ${{github.run_id}}"
            - name: Retrive Variable
              run: echo "my variable: ${{vars.MY_VAR}}"

   