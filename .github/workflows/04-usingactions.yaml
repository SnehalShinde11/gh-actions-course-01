name: 04 using actions
on: workflow_dispatch 

jobs: 
    build:
        runs-on: ubuntu-latest
        steps: 
            - name: checkout code
              uses: actions/checkout@v4
            - name: printing folders
              run: ls
            - name: setup node
              uses: actions/setup-node@v3
              with:
                node-version: '20.x'
            - name: Install dependenicies
              run: | 
              cd /04-workflowactions/react-app
              npm ci
          
 

            